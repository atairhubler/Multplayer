<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Plataforma Multiplayer PoC</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: #111; font-family: sans-serif; color: #fff; }
    #login {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.85); z-index: 10;
    }
    .card { background: #222; padding: 28px 32px; border-radius: 10px; width: 300px; }
    .card h2 { margin-top: 0; }
    .card input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; margin: 6px 0 14px; }
    .avatars { display: flex; gap: 10px; margin: 6px 0 18px; }
    .avatars label { cursor: pointer; }
    .avatars input { display: none; }
    .avatars span { display: block; width: 36px; height: 48px; border: 3px solid transparent; border-radius: 4px; }
    .avatars input:checked + span { border-color: #fff; }
    button { width: 100%; padding: 10px; font-size: 16px; cursor: pointer; }
    .upload { display: flex; align-items: center; gap: 10px; margin: 6px 0 18px; font-size: 12px; }
    .upload input { max-width: 190px; }
    #avatarPreview { width: 36px; height: 54px; object-fit: cover; border: 3px solid #fff; border-radius: 4px; }
    #sprites { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .gifSprite { position: absolute; left: 0; top: 0; object-fit: cover; transform-origin: 0 0; }
    #error { color: #f77; margin-top: 10px; min-height: 18px; font-size: 13px; }
    body { display: flex; }
    #game { flex: 1; min-width: 0; height: 100vh; }
    #chat { display: none; flex-direction: column; width: 260px; flex: none; height: 100vh; background: #1b1b1b;
      border-right: 1px solid #333; user-select: text; -webkit-user-select: text; touch-action: pan-y; z-index: 6; }
    #chat.open { display: flex; }
    #chatHead { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; font-weight: bold; border-bottom: 1px solid #333; }
    #chatHead button { width: auto; padding: 2px 8px; font-size: 14px; }
    #chatLog { flex: 1; overflow-y: auto; padding: 8px 10px; font-size: 14px; touch-action: pan-y; }
    #chatLog p { margin: 0 0 6px; word-wrap: break-word; overflow-wrap: anywhere; }
    #chatLog .who { font-weight: bold; color: #7fd1ff; }
    #chatLog .sys { color: #999; font-style: italic; }
    #chatBar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); width: min(560px, 92vw); z-index: 8; }
    #chatBar[hidden] { display: none; }
    #chatBar input { width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 16px; border: 2px solid #fff;
      border-radius: 8px; background: #000c; color: #fff; outline: none; user-select: text; -webkit-user-select: text; }
    #talkBtn { width: 56px !important; height: 56px !important; font-size: 24px !important; align-self: flex-end; }
    #chatOpen { display: none; position: fixed; top: 10px; left: 10px; z-index: 6; width: auto; padding: 6px 10px; font-size: 18px; }
    #chatOpen.show { display: block; }
    @media (max-width: 900px) {
      #chat { position: fixed; left: 0; top: 0; width: 220px; opacity: .93; }
    }
    #touch { display: none; position: fixed; left: 0; right: 0; bottom: 16px; padding: 0 16px; box-sizing: border-box;
      justify-content: space-between; z-index: 5; pointer-events: none; }
    #touch .grp { display: flex; gap: 14px; }
    #touch button { pointer-events: auto; width: 76px; height: 76px; border-radius: 50%; border: 2px solid #fff8;
      background: #0006; color: #fff; font-size: 30px; touch-action: none; }
    #touch button:active { background: #fff5; }
  </style>
</head>
<body>
  <div id="login">
    <div class="card">
      <h2>Entrar no Jogo</h2>
      <label>Nome</label>
      <input id="name" type="text" maxlength="16" placeholder="Seu nome">
      <label>Personagem</label>
      <div class="avatars">
        <label><input type="radio" name="char" value="red" checked><span style="background:#e74c3c"></span></label>
        <label><input type="radio" name="char" value="blue"><span style="background:#3498db"></span></label>
        <label><input type="radio" name="char" value="green"><span style="background:#2ecc71"></span></label>
        <label><input type="radio" name="char" value="yellow"><span style="background:#f1c40f"></span></label>
      </div>
      <label>Ou envie sua imagem</label>
      <div class="upload">
        <input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
        <img id="avatarPreview" alt="" hidden>
      </div>
      <button id="join">Entrar no Jogo</button>
      <div id="error"></div>
    </div>
  </div>
  <aside id="chat">
    <div id="chatHead"><span>Chat</span><button id="chatClose" title="Recolher">◀</button></div>
    <div id="chatLog"></div>
  </aside>
  <form id="chatBar" autocomplete="off" hidden>
    <input id="chatInput" type="text" maxlength="200" enterkeyhint="send" placeholder="Digite sua mensagem e pressione Enter (Esc cancela)">
  </form>
  <button id="chatOpen" title="Abrir chat">💬</button>
  <div id="game"></div>
  <div id="sprites"></div>
  <div id="touch">
    <div class="grp"><button data-key="left">◀</button><button data-key="right">▶</button></div>
    <button id="talkBtn" title="Falar">💬</button>
    <div class="grp"><button data-key="jump">▲</button></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
