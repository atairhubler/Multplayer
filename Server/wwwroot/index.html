<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Plataforma Multiplayer PoC</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: #111; font-family: sans-serif; color: #fff; }
    #login {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.85); z-index: 10;
    }
    .card { background: #222; padding: 28px 32px; border-radius: 10px; width: 300px; }
    .card h2 { margin-top: 0; }
    .card input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; margin: 6px 0 14px; }
    .card { max-height: 94vh; overflow-y: auto; touch-action: pan-y; }
    .builder { display: flex; gap: 12px; align-items: center; margin: 6px 0 14px; }
    .builder .opts { flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .builder .opts label { display: flex; justify-content: space-between; align-items: center; }
    .builder input[type=color] { width: 44px; height: 26px; padding: 0; border: 1px solid #555; background: none; cursor: pointer; }
    .gender { display: flex; gap: 12px; }
    #dollPreview { width: 96px; height: 120px; background: #87ceeb; border-radius: 6px; flex: none; }
    .upload { display: flex; align-items: center; gap: 10px; margin: 6px 0 18px; font-size: 12px; }
    .upload input { max-width: 190px; }
    #avatarPreview { width: 36px; height: 54px; object-fit: cover; border: 3px solid #fff; border-radius: 4px; }
    #sprites { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .gifSprite { position: absolute; left: 0; top: 0; object-fit: cover; transform-origin: 0 0; }
    #error { color: #f77; margin-top: 10px; min-height: 18px; font-size: 13px; }
    #game { width: 100vw; height: 100vh; }
    /* Chat estilo MMORPG: canto inferior esquerdo, fundo transparente, sobre o jogo */
    #chat { display: none; position: fixed; left: 12px; bottom: 12px; width: 360px; max-width: 70vw; z-index: 6; pointer-events: none;
      user-select: text; -webkit-user-select: text; }
    #chat.on { display: block; }
    /* O log é rolável (roda do mouse / arrastar no toque); as mensagens ficam coladas embaixo e crescem para cima */
    #chatLog { display: flex; flex-direction: column; overflow-y: auto; max-height: 50vh; pointer-events: auto; touch-action: pan-y;
      font-size: 14px; line-height: 1.35; padding: 4px 6px; border-radius: 6px; transition: background .2s;
      scrollbar-width: thin; scrollbar-color: transparent transparent; overscroll-behavior: contain; }
    #chatLog > :first-child { margin-top: auto; }
    #chatLog:hover { background: rgba(0, 0, 0, .35); scrollbar-color: #fff8 transparent; } /* barra só aparece com o mouse em cima */
    #chatLog:hover p.old { opacity: 1; }
    #chatLog p { margin: 0 0 3px; flex: none; word-wrap: break-word; overflow-wrap: anywhere; color: #fff;
      text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000; transition: opacity 1s; }
    #chatLog .who { font-weight: bold; color: #ffd966; }
    #chatLog .sys { color: #b9e6ff; font-style: italic; }
    #chatLog p.old { opacity: .45; }
    #chatLog p.fading { opacity: 0 !important; } /* avisos do sistema somem depois de alguns segundos */
    /* Botão de ajuda (canto inferior direito do jogo) e janela com os grupos de comandos */
    #helpBtn { position: fixed; right: 12px; bottom: 12px; z-index: 6; width: 36px; height: 36px; padding: 0; border-radius: 50%;
      border: 2px solid #fff9; background: rgba(0, 0, 0, .55); color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; }
    #helpBtn[hidden] { display: none; }
    #helpModal { position: fixed; inset: 0; z-index: 45; background: rgba(0, 0, 0, .6); display: flex; align-items: center; justify-content: center; }
    #helpModal[hidden] { display: none; }
    #helpPanel { width: min(520px, 92vw); max-height: 82vh; overflow-y: auto; background: #1b2238; border: 1px solid #fff5;
      border-radius: 12px; padding: 14px 16px; box-shadow: 0 0 30px #000a; }
    #helpPanel h3 { margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; }
    #helpClose { width: auto; padding: 2px 10px; background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
    #helpPanel details { border-top: 1px solid #fff2; padding: 6px 0; }
    #helpPanel summary { cursor: pointer; font-weight: bold; font-size: 15px; padding: 4px 0; }
    #helpPanel details > div { padding: 2px 0 6px 12px; font-size: 13px; line-height: 1.4; color: #dbe6f2; }
    #helpPanel details > div p { margin: 4px 0; }
    #helpPanel h4 { margin: 8px 0 2px; font-size: 13px; color: #ffd966; }
    /* Dica de movimento no centro da tela ao entrar */
    #moveHint { position: fixed; z-index: 6; transform: translate(-50%, -50%); padding: 12px 24px; background: rgba(0, 0, 0, .6);
      border: 1px solid #fff8; border-radius: 16px; font-size: 20px; pointer-events: none; text-shadow: 1px 1px 2px #000;
      white-space: nowrap; animation: hintPulse 1.6s ease-in-out infinite; }
    #moveHint[hidden] { display: none; }
    @keyframes hintPulse { 0%, 100% { opacity: 1; } 50% { opacity: .65; } }
    #chat.active #chatLog { background: rgba(0, 0, 0, .35); }
    #chat.active #chatLog p.old { opacity: 1; }
    #chatBar { margin-top: 4px; pointer-events: auto; }
    #chatBar[hidden] { display: none; }
    #chatBar input { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 16px; border: 1px solid #fff9;
      border-radius: 6px; background: rgba(0, 0, 0, .55); color: #fff; outline: none; user-select: text; -webkit-user-select: text; }
    @media (pointer: coarse) { #chatLog { font-size: 13px; } }
    /* Lista de online + botão de música (canto superior direito do jogo) */
    #online { position: fixed; top: 8px; right: 8px; z-index: 6; min-width: 120px; max-width: 200px; background: rgba(0, 0, 0, .45);
      border-radius: 8px; padding: 4px 6px; font-size: 13px; text-shadow: 1px 1px 2px #000; }
    #online[hidden] { display: none; }
    #onlineHead { display: flex; justify-content: space-between; gap: 6px; }
    #online button { width: auto; padding: 2px 8px; font-size: 14px; background: none; border: none; color: #fff; }
    #onlineList { list-style: none; margin: 4px 0 2px; padding: 0 4px; max-height: 40vh; overflow-y: auto; }
    #onlineList li { padding: 1px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #onlineList li.me { color: #ffd966; }
    #online.closed #onlineList, #online.closed #onlineHint { display: none; }
    #onlineHint { font-size: 11px; color: #cfd8dc; padding: 2px 4px; }
    /* Emotes no celular */
    /* Projeção de ilusão arcana: moldura sobre a cabeça de quem compartilha a tela, com o vídeo dentro */
    .proj { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: zoom-in; animation: projGlow 3s ease-in-out infinite; }
    .proj video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #0b1030; }
    .proj .ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; user-select: none; -webkit-user-drag: none; }
    .proj .idle { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 0 18%; color: #cfe3ff; font-size: calc(11px * var(--k, 1)); line-height: 1.25; text-shadow: 0 0 6px #000; pointer-events: none; }
    @keyframes projGlow { 0%, 100% { filter: drop-shadow(0 0 4px #7ab8ff66); } 50% { filter: drop-shadow(0 0 12px #b58cffcc); } }
    #theater { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .88); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; cursor: zoom-out; }
    #theater[hidden] { display: none; }
    #theater video { max-width: 92vw; max-height: 80vh; background: #000; border-radius: 8px; box-shadow: 0 0 40px #7ab8ff66; }
    #theaterCaption { font-size: 14px; color: #cfd8dc; }
    #hud { position: fixed; z-index: 6; transform: translateX(-50%); padding: 4px 14px; background: rgba(0, 0, 0, .55);
      border-radius: 14px; font-size: 14px; pointer-events: none; text-shadow: 1px 1px 2px #000; white-space: nowrap; }
    #hud[hidden] { display: none; }
    #interactHint { position: fixed; z-index: 6; transform: translateX(-50%); padding: 6px 16px; background: rgba(0, 0, 0, .6);
      border: 1px solid #fff8; border-radius: 14px; font-size: 14px; cursor: pointer; text-shadow: 1px 1px 2px #000; white-space: nowrap; }
    #interactHint[hidden] { display: none; }
    #emoteTray { flex-wrap: wrap; justify-content: center; max-width: 92vw; }
    #emoteTray { display: none; position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); gap: 8px; z-index: 7;
      background: rgba(0, 0, 0, .55); padding: 8px; border-radius: 12px; }
    #emoteTray.open { display: flex; }
    #emoteTray button { width: 48px; height: 48px; font-size: 26px; border-radius: 50%; padding: 0; }
    .grp.mid { align-items: flex-end; }
    #talkBtn, #emoteBtn { width: 56px !important; height: 56px !important; font-size: 24px !important; align-self: flex-end; }
    /* Aviso para girar o celular (modo paisagem obrigatório) */
    #rotate { display: none; position: fixed; inset: 0; z-index: 50; background: #111; color: #fff; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; text-align: center; font-size: 18px; padding: 24px; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    #touch { display: none; position: fixed; left: 0; right: 0; bottom: 16px; padding: 0 16px; box-sizing: border-box;
      justify-content: space-between; z-index: 5; pointer-events: none; }
    #touch .grp { display: flex; gap: 14px; }
    #touch button { pointer-events: auto; width: 76px; height: 76px; border-radius: 50%; border: 2px solid #fff8;
      background: #0006; color: #fff; font-size: 30px; touch-action: none; }
    #touch button:active { background: #fff5; }
  </style>
</head>
<body>
  <div id="login">
    <div class="card">
      <h2>Entrar no Jogo</h2>
      <label>Nome</label>
      <input id="name" type="text" maxlength="16" placeholder="Seu nome">
      <label>Personagem</label>
      <div class="builder">
        <div class="opts">
          <div class="gender">
            <label><input type="radio" name="gender" value="m" checked> Masculino</label>
            <label><input type="radio" name="gender" value="f"> Feminino</label>
          </div>
          <label>Cabelo <input type="color" id="cHair" value="#4a2c17"></label>
          <label>Pele <input type="color" id="cSkin" value="#f1c27d"></label>
          <label>Roupa <input type="color" id="cCloth" value="#3498db"></label>
          <label>Nome <input type="color" id="cName" value="#ffffff"></label>
        </div>
        <canvas id="dollPreview" width="192" height="240"></canvas>
      </div>
      <label>Ou envie sua imagem</label>
      <div class="upload">
        <input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
        <img id="avatarPreview" alt="" hidden>
      </div>
      <button id="join">Entrar no Jogo</button>
      <div id="error"></div>
    </div>
  </div>
  <aside id="chat">
    <div id="chatLog"></div>
    <form id="chatBar" autocomplete="off" hidden>
      <input id="chatInput" type="text" maxlength="200" enterkeyhint="send" placeholder="Enter envia · Esc cancela">
    </form>
  </aside>
  <div id="game"></div>
  <div id="sprites"></div>
  <div id="online" hidden>
    <div id="onlineHead"><button id="onlineToggle" title="Quem está online">👥 <span id="onlineCount">1</span></button><span><button id="voiceBtn" title="Chat de voz: entrar ou sair">🎧</button><button id="micBtn" title="Mutar ou desmutar o microfone" hidden>🎤</button><button id="muteBtn" title="Música">🔊</button></span></div>
    <ul id="onlineList"></ul>
    <div id="onlineHint">Emotes: teclas 1 a 6</div>
  </div>
  <div id="emoteTray"></div>
  <div id="hud" hidden></div>
  <div id="moveHint" hidden></div>
  <button id="helpBtn" title="Ajuda: como usar os comandos" hidden>?</button>
  <div id="helpModal" hidden>
    <div id="helpPanel" role="dialog" aria-label="Ajuda">
      <h3><span>❓ Ajuda: comandos e controles</span><button id="helpClose" title="Fechar">✕</button></h3>
      <div id="helpGroups"></div>
    </div>
  </div>
  <div id="theater" hidden><video autoplay playsinline></video><div id="theaterCaption"></div></div>
  <div id="interactHint" hidden></div>
  <div id="rotate"><div style="font-size:64px">📱</div><div>Gire o celular para o modo paisagem para jogar</div></div>
  <div id="touch">
    <div class="grp"><button data-key="left">◀</button><button data-key="right">▶</button></div>
    <div class="grp mid"><button id="talkBtn" title="Falar">💬</button><button id="emoteBtn" title="Emotes">😀</button></div>
    <div class="grp"><button data-key="jump">▲</button></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
